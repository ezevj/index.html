<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Espacial: El Enigma de Titius-Bode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #02020a;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Fondo Galáctico Vibrante */
        .space-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(80, 0, 150, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 100, 150, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(10, 10, 25, 1) 0%, #02020a 100%);
            z-index: -2;
        }

        .stars-container {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--d) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Sol Gigante */
        .sun {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 35% 35%, #fff 0%, #fffa00 15%, #ff8000 50%, #ff4000 100%);
            border-radius: 50%;
            box-shadow: 0 0 100px 20px rgba(255, 128, 0, 0.4), inset -15px -15px 30px rgba(0,0,0,0.4);
            position: absolute;
            left: -100px;
            top: 55%;
            transform: translateY(-50%);
            z-index: 30;
        }

        /* Planetas */
        .planet-container {
            position: absolute;
            top: 55%;
            transform: translateY(-50%) scale(0);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 40;
        }

        .planet-container.visible { transform: translateY(-50%) scale(1); }

        .planet-body {
            border-radius: 50%;
            position: relative;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8);
            transition: transform 0.4s ease;
        }

        .planet-container:hover .planet-body { transform: scale(1.1); }

        /* Estilo Planeta Real (Ghost) */
        .real-planet-ghost {
            position: absolute;
            top: 55%;
            transform: translateY(-50%) scale(0);
            transition: all 1s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            z-index: 35;
        }
        .real-planet-ghost.active { opacity: 0.6; transform: translateY(-50%) scale(1); }
        .real-planet-ghost .planet-body {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            filter: saturate(0.5) brightness(1.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Texturas Planetas */
        .planet-mercurio { background: radial-gradient(circle at 30% 30%, #bbb, #555); }
        .planet-venus { background: radial-gradient(circle at 40% 40%, #fff2cc, #d1a055); }
        .planet-tierra { background: #1a5e9a; background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3), transparent); }
        .planet-marte { background: radial-gradient(circle at 30% 30%, #ff6b4a, #7a2510); }
        .planet-ceres { background: radial-gradient(circle at 30% 30%, #fff, #444); box-shadow: 0 0 15px #fff; }
        .planet-jupiter { background: repeating-linear-gradient(180deg, #d39c7e 0%, #f3e5dc 15%, #d39c7e 30%); }
        .planet-saturno { background: linear-gradient(180deg, #e1cc9a, #b59a5a); }
        .planet-urano { background: radial-gradient(circle at 40% 40%, #d9ffff, #7ababa); }
        .planet-neptuno { background: radial-gradient(circle at 40% 40%, #7d8ff5, #1a2a8a); }

        .saturn-rings {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            width: 240%; height: 240%;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 40%, rgba(181, 154, 90, 0.5) 50%, transparent 60%);
        }

        /* Cinturón Asteroides */
        .asteroid-belt {
            position: absolute;
            left: 700px;
            top: 0; bottom: 0;
            width: 120px;
            pointer-events: none;
            display: none;
        }
        .asteroid { position: absolute; background: #666; border-radius: 50%; opacity: 0.5; }

        /* UI Compacta */
        .ui-panel {
            background: rgba(10, 10, 30, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 165, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .n-item {
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        .n-item.active { 
            background: #ea580c; 
            border-color: #ff9d66; 
            box-shadow: 0 0 10px rgba(234, 88, 12, 0.4);
        }

        #solar-system::-webkit-scrollbar { height: 8px; }
        #solar-system::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="space-bg"></div>
    <div id="stars-container" class="stars-container"></div>

    <!-- UI Compacta -->
    <div class="fixed top-0 left-0 right-0 p-4 z-50 flex justify-center">
        <div class="ui-panel p-4 rounded-2xl max-w-5xl w-full flex items-center gap-6">
            <div class="flex-shrink-0">
                <h1 class="text-xl font-black text-orange-500 uppercase tracking-tighter">LAB TITIUS-BODE</h1>
                <div id="planet-counter" class="text-[10px] text-orange-300 font-bold opacity-60">0 / 9 OBJETOS</div>
            </div>

            <div class="h-10 w-px bg-white/10"></div>

            <div class="flex-1 overflow-hidden">
                <div id="n-container" class="flex gap-2 overflow-x-auto pb-1">
                    <!-- Solo números aquí -->
                </div>
            </div>

            <div class="flex items-center gap-3">
                <input type="number" id="ua-input" step="0.1" placeholder="UA" 
                    class="w-20 bg-black/60 border border-white/20 rounded-xl px-2 py-2 text-xl text-center text-white font-bold focus:outline-none focus:border-orange-500">
                <button onclick="checkDistance()" 
                    class="bg-orange-600 hover:bg-orange-500 text-white px-5 py-2 rounded-xl font-bold text-sm transition-all transform active:scale-95">
                    ANALIZAR
                </button>
            </div>

            <div id="compare-btn-container" class="hidden">
                <button onclick="toggleComparison()" id="compare-btn"
                    class="bg-blue-600/30 border border-blue-500/50 text-blue-200 px-4 py-2 rounded-xl text-[10px] font-black hover:bg-blue-600 hover:text-white transition-all uppercase">
                    Modo Realidad
                </button>
            </div>
        </div>
    </div>

    <!-- Espacio del Sistema -->
    <div id="solar-system" class="relative w-full h-screen overflow-x-auto overflow-y-hidden pt-32 pb-10 scroll-smooth">
        <div class="sun"></div>
        <div id="asteroid-belt" class="asteroid-belt"></div>
        <div id="markers"></div>
    </div>

    <!-- Info Planeta -->
    <div id="info-panel" class="fixed bottom-6 right-6 z-[100] hidden">
        <div class="ui-panel p-6 rounded-2xl w-64 border-orange-500/30">
            <h3 id="info-title" class="text-xl font-black text-orange-500 uppercase italic"></h3>
            <p id="info-desc" class="text-sm text-gray-200 mt-2 leading-tight"></p>
            <button onclick="document.getElementById('info-panel').classList.add('hidden')" class="mt-4 w-full py-1 bg-white/5 rounded-lg text-[10px] font-bold">CERRAR</button>
        </div>
    </div>

    <!-- Modal Error -->
    <div id="error-modal" class="fixed inset-0 z-[110] flex items-center justify-center p-6 hidden backdrop-blur-md">
        <div class="bg-black border-2 border-red-600 p-8 rounded-3xl max-w-sm w-full text-center">
            <h2 class="text-3xl font-black text-red-600 mb-4 tracking-tighter">FALLA TOTAL</h2>
            <p class="text-gray-200 mb-6 text-sm">
                Teoría: <span class="text-white font-bold">38.8 UA</span><br>
                Realidad: <span class="text-white font-bold">30.1 UA</span>
            </p>
            <p class="text-[10px] text-red-400 uppercase font-bold mb-6">La matemática no coincide con el universo.</p>
            <button onclick="unlockComparison()" class="w-full bg-red-600 py-3 rounded-xl font-black hover:bg-red-500 transition-colors uppercase">Revelar Realidad</button>
        </div>
    </div>

    <script>
        const planetsData = [
            { id: "mercurio", name: "Mercurio", n: 0, ua: 0.4, realUa: 0.39, size: 30, desc: "Cercano al Sol. Error: 0.01 UA." },
            { id: "venus", name: "Venus", n: 3, ua: 0.7, realUa: 0.72, size: 50, desc: "Atmósfera densa. Error: 0.02 UA." },
            { id: "tierra", name: "Tierra", n: 6, ua: 1.0, realUa: 1.00, size: 52, desc: "Nuestra base: 1.0 UA." },
            { id: "marte", name: "Marte", n: 12, ua: 1.6, realUa: 1.52, size: 40, desc: "Planeta rojo. Error: 0.08 UA." },
            { id: "ceres", name: "Ceres", n: 24, ua: 2.8, realUa: 2.77, size: 20, desc: "Rey del cinturón de asteroides." },
            { id: "jupiter", name: "Júpiter", n: 48, ua: 5.2, realUa: 5.20, size: 120, desc: "Gigante gaseoso. ¡Acierto total!" },
            { id: "saturno", name: "Saturno", n: 96, ua: 10.0, realUa: 9.54, size: 100, desc: "Anillos visibles. Error: 0.46 UA." },
            { id: "urano", name: "Urano", n: 192, ua: 19.6, realUa: 19.18, size: 75, desc: "Descubierto en 1781." },
            { id: "neptuno", name: "Neptuno", n: 384, ua: 38.8, realUa: 30.07, size: 70, desc: "El gran error de la ley." }
        ];

        let discoveredCount = 0;
        let isComparisonActive = false;
        const scale = 250; 
        const system = document.getElementById('solar-system');
        const input = document.getElementById('ua-input');

        function createStars() {
            const container = document.getElementById('stars-container');
            for(let i=0; i<200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2;
                star.style.width = size + 'px'; star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--d', (Math.random() * 3 + 1) + 's');
                container.appendChild(star);
            }
        }

        function createAsteroids() {
            const belt = document.getElementById('asteroid-belt');
            for(let i=0; i<80; i++) {
                const ast = document.createElement('div');
                ast.className = 'asteroid';
                const size = Math.random() * 4 + 1;
                ast.style.width = size + 'px'; ast.style.height = size + 'px';
                ast.style.left = Math.random() * 100 + '%'; ast.style.top = Math.random() * 100 + '%';
                belt.appendChild(ast);
            }
        }

        function init() {
            createStars(); createAsteroids();
            const nContainer = document.getElementById('n-container');
            planetsData.forEach((p) => {
                const item = document.createElement('div');
                item.className = 'n-item';
                item.id = `n-val-${p.n}`;
                item.innerText = p.n;
                item.onclick = () => { input.value = p.ua; input.focus(); };
                nContainer.appendChild(item);

                const marker = document.createElement('div');
                marker.className = 'absolute bottom-4 text-[10px] text-gray-600 border-l border-gray-800 pl-1';
                marker.style.left = (p.ua * scale) + 'px';
                marker.innerText = p.ua + ' UA';
                document.getElementById('markers').appendChild(marker);
            });
        }

        function checkDistance() {
            const val = parseFloat(input.value);
            const planet = planetsData.find(p => Math.abs(p.ua - val) < 0.2);
            if (planet) {
                if (planet.id === 'neptuno' && discoveredCount < 8) return;
                planet.id === 'neptuno' ? showError() : addPlanet(planet);
            }
        }

        function addPlanet(p) {
            if (document.getElementById(`p-${p.id}`)) return;
            const container = document.createElement('div');
            container.id = `p-${p.id}`; container.className = 'planet-container';
            container.style.left = (p.ua * scale) + 'px';
            container.onclick = () => showInfo(p);
            
            let html = `<div class="planet-body planet-${p.id}" style="width:${p.size}px; height:${p.size}px;">`;
            if(p.id === 'saturno') html += `<div class="saturn-rings"></div>`;
            html += `</div><span class="mt-2 text-[10px] font-bold text-white uppercase">${p.name}</span>`;
            
            container.innerHTML = html;
            system.appendChild(container);
            setTimeout(() => container.classList.add('visible'), 50);
            if(p.id === 'ceres') document.getElementById('asteroid-belt').style.display = 'block';

            document.getElementById(`n-val-${p.n}`).classList.add('active');
            discoveredCount++;
            document.getElementById('planet-counter').innerText = `${discoveredCount} / 9 OBJETOS`;
            input.value = "";
            system.scrollTo({ left: (p.ua * scale) - (window.innerWidth / 2), behavior: 'smooth' });
        }

        function showInfo(p) {
            document.getElementById('info-title').innerText = p.name;
            document.getElementById('info-desc').innerText = p.desc;
            document.getElementById('info-panel').classList.remove('hidden');
        }

        function showError() { document.getElementById('error-modal').classList.remove('hidden'); }

        function unlockComparison() {
            document.getElementById('error-modal').classList.add('hidden');
            document.getElementById('compare-btn-container').classList.remove('hidden');
            addPlanet(planetsData[8]); 
            toggleComparison();
        }

        function toggleComparison() {
            isComparisonActive = !isComparisonActive;
            const btn = document.getElementById('compare-btn');
            if (isComparisonActive) {
                btn.classList.add('bg-blue-600', 'text-white');
                showRealPlanets();
            } else {
                btn.classList.remove('bg-blue-600', 'text-white');
                hideRealPlanets();
            }
        }

        function showRealPlanets() {
            planetsData.forEach(p => {
                const ghost = document.createElement('div');
                ghost.className = 'real-planet-ghost';
                ghost.id = `real-${p.id}`;
                ghost.style.left = (p.realUa * scale) + 'px';
                
                let html = `<div class="planet-body planet-${p.id}" style="width:${p.size}px; height:${p.size}px;">`;
                if(p.id === 'saturno') html += `<div class="saturn-rings"></div>`;
                html += `</div><span class="mt-2 text-[8px] font-black text-blue-400 uppercase">Posición Real (${p.realUa} UA)</span>`;
                
                ghost.innerHTML = html;
                system.appendChild(ghost);
                setTimeout(() => ghost.classList.add('active'), 50);
            });
            // Opacamos la teoría para que resalte la realidad
            document.querySelectorAll('.planet-container').forEach(el => el.style.opacity = '0.4');
        }

        function hideRealPlanets() {
            planetsData.forEach(p => {
                const el = document.getElementById(`real-${p.id}`);
                if (el) el.remove();
            });
            document.querySelectorAll('.planet-container').forEach(el => el.style.opacity = '1');
        }

        init();
    </script>
</body>
</html>
